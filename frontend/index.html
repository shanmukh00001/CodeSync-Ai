<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>CodeSync AI — Real-Time Collaborative Coding</title>
    <style>
      /* Zero-latency initial bootloader style before JS bundle executes */
      body {
        margin: 0;
        background-color: #080b0f;
        color: #f8fafc;
      }
      .app-initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 40%, rgba(249, 115, 22, 0.08), transparent 50%),
                    radial-gradient(circle at 50% 60%, rgba(6, 182, 212, 0.05), transparent 60%),
                    #080b0f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
      }
      .app-initial-orbit {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.06);
        border-top-color: #f97316;
        border-right-color: #06b6d4;
        animation: initial-spin 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        margin-bottom: 20px;
        position: relative;
      }
      .app-initial-badge {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 44px;
        height: 44px;
        background: #161e28;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 15px;
        color: #f97316;
      }
      .app-initial-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #f8fafc;
        margin-bottom: 6px;
      }
      .app-initial-subtitle {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 16px;
      }
      .app-initial-bar {
        width: 180px;
        height: 3px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .app-initial-bar-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        background: linear-gradient(90deg, #f97316, #06b6d4);
        border-radius: 999px;
        animation: initial-bar 1.4s ease-in-out infinite;
      }
      @keyframes initial-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes initial-bar {
        0% { left: -40%; width: 40%; }
        50% { left: 30%; width: 50%; }
        100% { left: 100%; width: 40%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-initial-loader">
        <div class="app-initial-orbit">
          <div class="app-initial-badge">CS</div>
        </div>
        <div class="app-initial-title">CodeSync AI</div>
        <div class="app-initial-subtitle">Loading collaborative workspace...</div>
        <div class="app-initial-bar">
          <div class="app-initial-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
